; ESP-NOW monorepo
; Each device = one [env:...]. Sources scoped via build_src_filter.
; Add a new sensor: drop sources in sensors/<name>/, add an [env:<name>] block.

[platformio]
src_dir = .
default_envs = bridge

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -I${PROJECT_DIR}/shared

[env:bridge]
board = esp32dev
build_src_filter = -<*> +<bridge/>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7

[env:test_sender]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensors/test_sender/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7

[env:soil_moisture]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensors/soil_moisture/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7

[env:lemon_moisture]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensors/lemon_moisture/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7

[env:price_display]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<displays/price/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7
    olikraus/U8g2@^2.35.30

; ESP-NOW monorepo
; Each device = one [env:...]. Sources scoped via build_src_filter.
; Add a new sensor: drop sources in sensors/<name>/, add an [env:<name>] block.

[platformio]
src_dir = .
default_envs = bridge

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -I${PROJECT_DIR}/shared

[env:bridge]
board = esp32dev
build_src_filter = -<*> +<bridge/>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7

[env:test_sender]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensors/test_sender/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7

[env:soil_moisture]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensors/soil_moisture/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7

[env:lemon_moisture]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensors/lemon_moisture/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7

[env:price_display]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<displays/price/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7
    olikraus/U8g2@^2.35.30

; Aquarium temp sensors: always-on ESP-NOW sender + OLED. Two identical units,
; differing only in -DAQ_UNIT (drives the id/name).
[aquarium_base]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensors/aquarium/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7
    olikraus/U8g2@^2.35.30
    milesburton/DallasTemperature@^3.11
    paulstoffregen/OneWire@^2.3.7

[env:aquarium_1]
extends = aquarium_base
build_flags = ${aquarium_base.build_flags} -DAQ_UNIT=1

[env:aquarium_2]
extends = aquarium_base
build_flags = ${aquarium_base.build_flags} -DAQ_UNIT=2

; Throwaway WiFi/RF diagnostic (RSSI + internet reachability).
[env:wifitest]
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<sensors/wifitest/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
